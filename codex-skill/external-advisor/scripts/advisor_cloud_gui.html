<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111312">
    <title>Advisor Cloud</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/advisor-cloud.css">
    <script src="/advisor-cloud.js" defer></script>
</head>
<body>
    <a class="skip-link" href="#advisor-main">Skip to conversation</a>

    <div class="advisor-app">
        <aside class="advisor-sidebar" id="advisor-sidebar" aria-label="Cloud conversations">
            <header class="brand-bar">
                <div class="brand-mark" aria-hidden="true">AC</div>
                <div class="brand-copy">
                    <h1>Advisor Cloud</h1>
                    <div class="session-state" id="session-state" role="status">
                        <span class="state-dot" aria-hidden="true"></span>
                        <span id="session-state-text">Connecting…</span>
                    </div>
                </div>
                <button class="icon-button sidebar-close" id="sidebar-close" type="button"
                        aria-label="Collapse conversations" title="Collapse conversations">‹</button>
            </header>

            <div class="sidebar-controls">
                <label class="field-label" for="project-select">Project</label>
                <select id="project-select" name="project" autocomplete="off"></select>

                <div class="search-row">
                    <label class="sr-only" for="conversation-search">Search conversations</label>
                    <input id="conversation-search" name="conversation-search" type="search"
                           autocomplete="off" placeholder="Search conversations…">
                    <button class="icon-button" id="refresh-project" type="button"
                            aria-label="Refresh conversations" title="Refresh conversations">↻</button>
                </div>
            </div>

            <nav class="conversation-list" id="conversation-list" aria-label="Project conversations"
                 aria-live="polite" aria-busy="true"></nav>

            <footer class="sidebar-footer">
                <span class="local-state"><span aria-hidden="true"></span>Loopback only</span>
                <button class="quiet-button" id="clear-view" type="button">Clear view</button>
            </footer>
        </aside>

        <button class="sidebar-backdrop" id="sidebar-backdrop" type="button"
                aria-label="Close conversations" tabindex="-1"></button>

        <main class="advisor-main" id="advisor-main">
            <header class="conversation-header">
                <button class="icon-button sidebar-open" id="sidebar-open" type="button"
                        aria-label="Open conversations" title="Open conversations">☰</button>
                <div class="conversation-heading">
                    <span class="eyebrow" id="conversation-project">ChatGPT Project</span>
                    <h2 id="conversation-title">No conversation selected</h2>
                </div>
                <div class="header-actions">
                    <label class="mode-control" for="mode-select">
                        <span>Mode</span>
                        <select id="mode-select" name="mode" autocomplete="off" aria-label="ChatGPT mode">
                            <option value="thinking">Thinking Max</option>
                            <option value="pro">Pro Extended</option>
                        </select>
                    </label>
                    <span class="cloud-state" id="cloud-state">
                        <span aria-hidden="true"></span>Cloud linked
                    </span>
                </div>
            </header>

            <section class="empty-state" id="empty-state" aria-labelledby="empty-title">
                <div class="empty-mark" aria-hidden="true">AC</div>
                <h2 id="empty-title">No conversation selected</h2>
            </section>

            <section class="transcript" id="transcript" aria-label="Conversation messages" hidden></section>

            <footer class="composer-region" id="composer-region" hidden>
                <form class="composer" id="composer-form">
                    <div class="attachment-tray" id="attachment-tray"
                         aria-label="Attached images" aria-live="polite" hidden></div>
                    <label class="sr-only" for="message-input">Message</label>
                    <textarea id="message-input" name="message" rows="1" maxlength="200000"
                              autocomplete="off" placeholder="Message ChatGPT…"></textarea>
                    <input id="image-input" name="images" type="file"
                           accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden>
                    <div class="composer-footer">
                        <div class="composer-context">
                            <button class="icon-button attach-button" id="attach-images" type="button"
                                    aria-label="Attach images" title="Attach images">+</button>
                            <span class="turn-state" id="turn-state" role="status" aria-live="polite">Ready</span>
                        </div>
                        <div class="composer-actions">
                            <button class="icon-button stop-button" id="stop-turn" type="button"
                                    aria-label="Stop receiving" title="Stop receiving" hidden>■</button>
                            <button class="send-button" id="send-message" type="submit"
                                    aria-label="Send message" title="Send message">
                                <span>Send</span><span aria-hidden="true">↑</span>
                            </button>
                        </div>
                    </div>
                </form>
            </footer>
        </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
